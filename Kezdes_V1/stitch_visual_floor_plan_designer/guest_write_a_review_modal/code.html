<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0048ff",
                        "background-light": "#f5f6f8",
                        "background-dark": "#0f1523",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<title>Write a Review - Kezdes</title>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen">
<!-- Background Mockup (Blurred) -->
<div class="fixed inset-0 z-0 overflow-hidden opacity-40 grayscale pointer-events-none">
<div class="layout-container flex h-full grow flex-col">
<header class="flex items-center justify-between border-b border-slate-200 bg-white px-10 py-3">
<div class="flex items-center gap-8">
<div class="flex items-center gap-4 text-primary">
<span class="material-symbols-outlined text-3xl">restaurant</span>
<h2 class="text-slate-900 text-lg font-bold">Kezdes</h2>
</div>
</div>
<div class="flex items-center gap-4">
<div class="size-10 rounded-full bg-slate-200"></div>
</div>
</header>
<main class="p-10">
<div class="h-6 w-48 bg-slate-200 rounded mb-4"></div>
<div class="grid grid-cols-3 gap-6">
<div class="h-64 bg-white rounded-xl shadow-sm border border-slate-100"></div>
<div class="h-64 bg-white rounded-xl shadow-sm border border-slate-100"></div>
<div class="h-64 bg-white rounded-xl shadow-sm border border-slate-100"></div>
</div>
</main>
</div>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
<!-- Modal Content -->
<div class="bg-white dark:bg-slate-900 w-full max-w-[640px] rounded-xl shadow-2xl flex flex-col overflow-hidden animate-in fade-in zoom-in duration-300">
<!-- Header -->
<div class="flex items-center justify-between px-8 pt-8 pb-4">
<div class="flex flex-col">
<h1 class="text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white">Write a Review</h1>
<p class="text-slate-500 text-sm mt-1">Tell others about your experience at <span class="text-primary font-semibold">The Blue Bistro</span></p>
</div>
<button class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors">
<span class="material-symbols-outlined text-slate-400">close</span>
</button>
</div>
<div class="px-8 py-4 overflow-y-auto max-h-[80vh]">
<!-- Star Rating Section -->
<div class="flex flex-col items-center justify-center py-6 border-b border-slate-100 dark:border-slate-800 mb-6">
<p class="text-slate-900 dark:text-slate-200 font-bold mb-3 text-lg">How was your visit?</p>
<div class="flex gap-2">
<button class="group">
<span class="material-symbols-outlined text-primary text-5xl transition-all group-hover:scale-110" style="font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 48;">star</span>
</button>
<button class="group">
<span class="material-symbols-outlined text-primary text-5xl transition-all group-hover:scale-110" style="font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 48;">star</span>
</button>
<button class="group">
<span class="material-symbols-outlined text-primary text-5xl transition-all group-hover:scale-110" style="font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 48;">star</span>
</button>
<button class="group">
<span class="material-symbols-outlined text-primary text-5xl transition-all group-hover:scale-110" style="font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 48;">star</span>
</button>
<button class="group">
<span class="material-symbols-outlined text-primary text-5xl transition-all group-hover:scale-110" style="font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;">star</span>
</button>
</div>
<p class="text-primary text-xs font-bold uppercase tracking-widest mt-3">Very Good</p>
</div>
<!-- Review Text Section -->
<div class="space-y-4">
<div class="flex flex-col gap-2">
<label class="text-slate-700 dark:text-slate-300 font-semibold text-sm">Share your experience</label>
<textarea class="w-full min-h-[160px] p-4 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all resize-none placeholder:text-slate-400" placeholder="The food was amazing, and the service was top-notch..."></textarea>
</div>
<!-- Photo Upload Section -->
<div class="flex flex-col gap-2">
<label class="text-slate-700 dark:text-slate-300 font-semibold text-sm">Add Photos</label>
<div class="flex flex-wrap gap-3">
<!-- Add Photo Trigger -->
<button class="w-24 h-24 rounded-lg border-2 border-dashed border-primary/30 hover:border-primary bg-primary/5 hover:bg-primary/10 transition-all flex flex-col items-center justify-center gap-1 group">
<span class="material-symbols-outlined text-primary text-2xl group-hover:scale-110 transition-transform">add_a_photo</span>
<span class="text-[10px] font-bold text-primary uppercase">Upload</span>
</button>
<!-- Sample Preview (Optional visibility) -->
<div class="relative w-24 h-24 rounded-lg overflow-hidden border border-slate-100 shadow-sm">
<img class="w-full h-full object-cover" data-alt="Close up shot of a gourmet pasta dish" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD47EHIiFyRpcyrlK4Y57EsBLOtFS8DejP_nVQFILpygJaZt1pUnOg9VaU16IRjIWs4Cc30Zpu3Xe-2m8Gl-oiJBEDCwAoP3-ggUoWLE1tNljgNQddMmCTlwgQWdyYzc_vkUIA43QYFq-XgC9FpwWuzhgtQ4VB1tMlaQTWrmYjEx7JNqikbcU5609xsQ4V_FN5oGDSgi7eTnNlut-9wAwtv0RM-eElyZ39bgOZXkK4lVsv-IXw8w3UKWnKKdGSTkfXCF5O7MhZHlQ"/>
<button class="absolute top-1 right-1 size-5 bg-white/90 rounded-full flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-[14px] text-red-500 font-bold">close</span>
</button>
</div>
</div>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="px-8 py-6 bg-slate-50 dark:bg-slate-800/50 flex flex-col sm:flex-row items-center justify-between gap-4 mt-4">
<div class="flex items-center gap-2">
<input class="rounded border-slate-300 text-primary focus:ring-primary size-4" id="anonymous" type="checkbox"/>
<label class="text-sm text-slate-500 cursor-pointer" for="anonymous">Post review anonymously</label>
</div>
<div class="flex gap-3 w-full sm:w-auto">
<button class="flex-1 sm:flex-none px-6 py-3 rounded-lg text-slate-600 dark:text-slate-400 font-bold text-sm hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                        Cancel
                    </button>
<button class="flex-1 sm:flex-none min-w-[140px] px-8 py-3 bg-primary text-white font-bold rounded-lg shadow-lg shadow-primary/20 hover:bg-blue-700 transition-all active:scale-95">
                        Post Review
                    </button>
</div>
</div>
</div>
</div>
</body></html>
