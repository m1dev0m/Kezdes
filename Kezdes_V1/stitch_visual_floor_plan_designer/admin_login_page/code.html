<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4800ff",
                        "background-light": "#f6f5f8",
                        "background-dark": "#150f23",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"

                },
            },

<title>Kezdes Admin Login</title>
</head>
<body class="font-display bg-background-light dark:bg-background-dark min-h-screen flex items-center justify-center relative overflow-hidden">
<!-- Subtle Mesh Gradient Background -->
<div class="absolute inset-0 z-0 opacity-40 pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-primary/20 blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-primary/10 blur-[120px]"></div>
</div>
<div class="relative z-10 w-full max-w-[480px] px-6">
<!-- Logo Section -->
<div class="flex flex-col items-center mb-8">
<div class="size-12 bg-primary flex items-center justify-center rounded-xl mb-4 shadow-lg shadow-primary/20">

<h1 class="text-slate-900 dark:text-slate-100 text-2xl font-bold tracking-tight">Kezdes Admin</h1>
<p class="text-slate-500 dark:text-slate-400 mt-2 text-center">Manage your restaurant operations efficiently.</p>
</div>
<!-- Login Card -->
<div class="bg-white dark:bg-background-dark/50 border border-slate-200 dark:border-slate-800 rounded-xl p-8 shadow-sm">
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-semibold mb-6">Welcome back</h2>
<form action="#" class="space-y-5">
<!-- Email Input -->
<div class="flex flex-col space-y-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-medium">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[20px]">mail</span>
<input class="w-full bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 rounded-lg pl-10 pr-4 py-3 text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" placeholder="name@restaurant.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col space-y-2">
<div class="flex items-center justify-between">
<label class="text-slate-700 dark:text-slate-300 text-sm font-medium">Password</label>
<a class="text-primary text-sm font-semibold hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[20px]">lock</span>
<input class="w-full bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 rounded-lg pl-10 pr-12 py-3 text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Login Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-white font-semibold py-3.5 rounded-lg shadow-md shadow-primary/20 transition-all flex items-center justify-center gap-2 mt-2" type="submit">
<span>Login</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-slate-100 dark:border-slate-800"></div>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="bg-white dark:bg-background-dark/80 px-2 text-slate-400">Security Verified</span>
</div>
</div>
<!-- Footer Link -->
<div class="text-center">
<p class="text-slate-500 dark:text-slate-400 text-sm">
                    Don't have an account? 
                    <a class="text-primary font-semibold hover:underline" href="#">Register your restaurant</a>
</p>
</div>
</div>
<!-- Utility Footer -->
<div class="mt-8 flex items-center justify-between text-slate-400 text-xs px-2">
<span>© 2024 Kezdes Admin Inc.</span>
<div class="flex gap-4">
<a class="hover:text-slate-600 dark:hover:text-slate-200 transition-colors" href="#">Privacy</a>
<a class="hover:text-slate-600 dark:hover:text-slate-200 transition-colors" href="#">Terms</a>
<a class="hover:text-slate-600 dark:hover:text-slate-200 transition-colors" href="#">Support</a>
</div>
</div>
</div>
<!-- Background Decorative Image -->
<div class="fixed top-0 right-0 w-1/3 h-full overflow-hidden opacity-5 pointer-events-none hidden lg:block">

</div>
