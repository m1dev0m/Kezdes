<!DOCTYPE html>

<html lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<title>Kezdes Onboarding</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased">

</div>
<h2 class="text-slate-900 dark:text-white text-xl font-bold leading-tight tracking-tight">Kezdes</h2>
</div>
<button class="text-primary font-semibold text-sm hover:opacity-80 transition-opacity">

            </button>

<div class="flex-1 flex flex-col justify-center px-6">
<div class="relative w-full aspect-[4/3] rounded-3xl overflow-hidden shadow-sm border border-slate-100 dark:border-slate-800">
<div class="w-full h-full bg-center bg-no-repeat bg-cover" data-alt="Modern high-end restaurant interior for business meetings" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCnhFamAR9Jr60FYPU3ibGvAa9j8DFhOGDVyoCqELe3jSwYv9vygC8O22VTEMitS2kpacX3YAoyrxPoswEhMGYCogSZnZNoHpXv6z5RQz1VqKO8KKPxbiJAqU5G2i-AawqjSeiigVcOvhKN30j3wazYkcCQq-3arXP-0FwaBEZMwej60QNhP4AKHDi-GkAKo3GaGokDfvelFNZasUSPbVnMFL4h-tqQkNtHgJddcpxfZoT69sRgherHMem-1_doRicNW0kJdk59_-0");'>
<!-- Subtle Gradient Overlay -->
<div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent"></div>
</div>
</div>
<!-- Text Content -->
<div class="mt-10 text-center space-y-4">
<h1 class="text-slate-900 dark:text-white text-3xl font-extrabold leading-[1.1] tracking-tight">
                    Добро пожаловать <br/> в Kezdes
                </h1>
<p class="text-slate-600 dark:text-slate-400 text-base font-medium leading-relaxed px-4">
                    Профессиональное бронирование ресторанов для ваших деловых встреч.
                </p>
</div>
<!-- Pagination Indicators -->
<div class="flex w-full flex-row items-center justify-center gap-2 mt-8">
<div class="h-1.5 w-6 rounded-full bg-primary"></div>
<div class="h-1.5 w-1.5 rounded-full bg-slate-200 dark:bg-slate-700"></div>
<div class="h-1.5 w-1.5 rounded-full bg-slate-200 dark:bg-slate-700"></div>
</div>
</div>
<!-- Actions / Footer Section -->
<div class="px-6 pb-12 pt-6 space-y-4">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2">
                Начать работу
                <span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
<div class="text-center">
<button class="text-slate-500 dark:text-slate-400 text-sm font-medium">

</button>
</div>
</div>

<div class="flex justify-center pb-2">
<div class="h-1.5 w-32 rounded-full bg-slate-200 dark:bg-slate-800"></div>
