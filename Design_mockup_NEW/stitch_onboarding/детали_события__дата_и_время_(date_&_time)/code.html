<!DOCTYPE html>

<html class="light" lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Детали события: Дата и Время</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .ios-wheel-shadow {
            background: linear-gradient(to bottom, rgba(255,255,255,1) 0%, rgba(255,255,255,0) 20%, rgba(255,255,255,0) 80%, rgba(255,255,255,1) 100%);
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex justify-center">
<!-- Mobile Container (iPhone Factor) -->
<div class="relative w-full max-w-[430px] bg-white dark:bg-slate-900 min-h-screen flex flex-col shadow-2xl overflow-hidden">
<!-- Top Navigation Bar -->
<div class="sticky top-0 z-20 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md px-4 py-3 flex items-center justify-between border-b border-slate-200 dark:border-slate-800">
<button class="text-primary flex items-center gap-1">
<span class="material-symbols-outlined text-[28px]">chevron_left</span>
</button>
<h1 class="text-lg font-bold tracking-tight">Детали события</h1>
<div class="w-10"></div> <!-- Spacer for symmetry -->
</div>
<!-- Progress Section -->
<div class="px-6 py-4 space-y-3">
<div class="flex justify-between items-end">
<span class="text-sm font-semibold text-primary">Шаг 2 из 4</span>
<span class="text-xs text-slate-500 dark:text-slate-400">Дата и Время</span>
</div>
<div class="h-1.5 w-full bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full" style="width: 50%;"></div>
</div>
</div>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto pb-32 px-6 space-y-8 hide-scrollbar">
<!-- Date Picker Section -->
<section class="space-y-4">
<h2 class="text-xl font-bold flex items-center gap-2">
<span class="material-symbols-outlined text-primary">calendar_today</span>
                    Дата встречи
                </h2>
<div class="bg-slate-50 dark:bg-slate-800/50 rounded-xl p-4 border border-slate-100 dark:border-slate-800">
<!-- Calendar Header -->
<div class="flex items-center justify-between mb-4">
<button class="p-1 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg transition-colors">
<span class="material-symbols-outlined text-slate-600 dark:text-slate-400">chevron_left</span>
</button>
<span class="font-bold text-base">Октябрь 2024</span>
<button class="p-1 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg transition-colors">
<span class="material-symbols-outlined text-slate-600 dark:text-slate-400">chevron_right</span>
</button>
</div>
<!-- Calendar Grid -->
<div class="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-slate-400 mb-2">
<div>ПН</div><div>ВТ</div><div>СР</div><div>ЧТ</div><div>ПТ</div><div class="text-rose-400">СБ</div><div class="text-rose-400">ВС</div>
</div>
<div class="grid grid-cols-7 gap-1">
<!-- Empty slots for previous month -->
<div class="h-10"></div><div class="h-10"></div><div class="h-10"></div>
<!-- Current month days -->
<button class="h-10 flex items-center justify-center rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700">1</button>
<button class="h-10 flex items-center justify-center rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700">2</button>
<button class="h-10 flex items-center justify-center rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700">3</button>
<button class="h-10 flex items-center justify-center rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700">4</button>
<button class="h-10 flex items-center justify-center rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700">5</button>
<button class="h-10 flex items-center justify-center rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700">6</button>
<button class="h-10 flex items-center justify-center rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700">7</button>
<button class="h-10 flex items-center justify-center rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700">8</button>
<button class="h-10 flex items-center justify-center rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700">9</button>
<button class="h-10 flex items-center justify-center rounded-lg bg-primary text-white font-bold shadow-lg shadow-primary/30">10</button>
<button class="h-10 flex items-center justify-center rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700">11</button>
<button class="h-10 flex items-center justify-center rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700">12</button>
<button class="h-10 flex items-center justify-center rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700">13</button>
<button class="h-10 flex items-center justify-center rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700">14</button>
<button class="h-10 flex items-center justify-center rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700">15</button>
<button class="h-10 flex items-center justify-center rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700">16</button>
<button class="h-10 flex items-center justify-center rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700">17</button>
<button class="h-10 flex items-center justify-center rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-300 pointer-events-none">18</button>
</div>
</div>
</section>
<!-- Time Picker Section -->
<section class="space-y-4">
<h2 class="text-xl font-bold flex items-center gap-2">
<span class="material-symbols-outlined text-primary">schedule</span>
                    Время
                </h2>
<div class="relative bg-slate-50 dark:bg-slate-800/50 rounded-xl overflow-hidden border border-slate-100 dark:border-slate-800">
<!-- iOS Style Time Picker -->
<div class="flex justify-center items-center h-40 relative px-10">
<!-- Selector Overlay -->
<div class="absolute inset-x-0 h-10 bg-primary/10 border-y border-primary/20 pointer-events-none top-1/2 -translate-y-1/2"></div>
<!-- Hours -->
<div class="flex-1 text-center overflow-hidden h-full relative">
<div class="ios-wheel-shadow absolute inset-0 z-10 pointer-events-none"></div>
<div class="flex flex-col gap-2 pt-16">
<span class="text-lg text-slate-400">17</span>
<span class="text-2xl font-bold text-slate-900 dark:text-white">18</span>
<span class="text-lg text-slate-400">19</span>
</div>
</div>
<span class="text-2xl font-bold pb-1">:</span>
<!-- Minutes -->
<div class="flex-1 text-center overflow-hidden h-full relative">
<div class="ios-wheel-shadow absolute inset-0 z-10 pointer-events-none"></div>
<div class="flex flex-col gap-2 pt-16">
<span class="text-lg text-slate-400">15</span>
<span class="text-2xl font-bold text-slate-900 dark:text-white">30</span>
<span class="text-lg text-slate-400">45</span>
</div>
</div>
</div>
</div>
</section>
<!-- Guests Section -->
<section class="space-y-4">
<div class="flex justify-between items-center">
<h2 class="text-xl font-bold flex items-center gap-2">
<span class="material-symbols-outlined text-primary">groups</span>
                        Количество гостей
                    </h2>
</div>
<div class="flex items-center justify-between bg-slate-50 dark:bg-slate-800/50 p-6 rounded-xl border border-slate-100 dark:border-slate-800">
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-white dark:bg-slate-700 shadow-sm border border-slate-200 dark:border-slate-600 text-primary active:scale-95 transition-transform">
<span class="material-symbols-outlined font-bold">remove</span>
</button>
<div class="text-center">
<span class="text-4xl font-bold">4</span>
<p class="text-[10px] uppercase tracking-wider text-slate-400 font-bold mt-1">Гостей</p>
</div>
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-primary shadow-lg shadow-primary/30 text-white active:scale-95 transition-transform">
<span class="material-symbols-outlined font-bold">add</span>
</button>
</div>
<p class="text-xs text-center text-slate-500 italic">Минимум 2, максимум 20 гостей для данного бронирования</p>
</section>
</div>
<!-- Sticky Footer Action -->
<div class="absolute bottom-0 inset-x-0 p-6 bg-gradient-to-t from-white dark:from-slate-900 via-white dark:via-slate-900 to-transparent pt-10">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-xl shadow-primary/25 transition-all active:scale-[0.98] flex items-center justify-center gap-2">
<span>Далее</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</div>
</body></html>
