<!DOCTYPE html>

<html lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Расширенные фильтры - Kezdes V2</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#207fdf",
                        "background-light": "#f6f7f8",
                        "background-dark": "#111921",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .custom-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .checkbox-custom:checked {
            background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z'/%3e%3c/svg%3e");
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<!-- Header Navigation Bar -->
<header class="sticky top-0 z-20 bg-white/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 py-3 flex items-center justify-between">
<button class="w-10 h-10 flex items-center justify-start text-slate-900 dark:text-slate-100">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="text-lg font-bold tracking-tight">Фильтры</h1>
<button class="text-primary font-semibold text-sm px-2">Сбросить</button>
</header>
<main class="flex-1 overflow-y-auto pb-32">
<!-- Section: Деловое оснащение -->
<section class="mt-6 px-4">
<h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-3 px-1">Деловое оснащение</h2>
<div class="bg-white dark:bg-slate-900 rounded-xl overflow-hidden border border-slate-200 dark:border-slate-800">
<label class="flex items-center justify-between p-4 border-b border-slate-100 dark:border-slate-800 last:border-0 active:bg-slate-50 dark:active:bg-slate-800 transition-colors">
<span class="text-base font-medium">Проектор</span>
<input checked="" class="checkbox-custom h-6 w-6 rounded-lg border-slate-300 dark:border-slate-700 text-primary focus:ring-primary focus:ring-offset-0 bg-transparent" type="checkbox"/>
</label>
<label class="flex items-center justify-between p-4 border-b border-slate-100 dark:border-slate-800 last:border-0 active:bg-slate-50 dark:active:bg-slate-800 transition-colors">
<span class="text-base font-medium">Wi-Fi</span>
<input checked="" class="checkbox-custom h-6 w-6 rounded-lg border-slate-300 dark:border-slate-700 text-primary focus:ring-primary focus:ring-offset-0 bg-transparent" type="checkbox"/>
</label>
<label class="flex items-center justify-between p-4 border-b border-slate-100 dark:border-slate-800 last:border-0 active:bg-slate-50 dark:active:bg-slate-800 transition-colors">
<span class="text-base font-medium">VIP-зал</span>
<input class="checkbox-custom h-6 w-6 rounded-lg border-slate-300 dark:border-slate-700 text-primary focus:ring-primary focus:ring-offset-0 bg-transparent" type="checkbox"/>
</label>
<label class="flex items-center justify-between p-4 border-b border-slate-100 dark:border-slate-800 last:border-0 active:bg-slate-50 dark:active:bg-slate-800 transition-colors">
<span class="text-base font-medium">Звуковое оборудование</span>
<input class="checkbox-custom h-6 w-6 rounded-lg border-slate-300 dark:border-slate-700 text-primary focus:ring-primary focus:ring-offset-0 bg-transparent" type="checkbox"/>
</label>
</div>
</section>
<!-- Section: Тип кухни -->
<section class="mt-8">
<h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-3 px-5">Тип кухни</h2>
<div class="flex gap-2 px-4 overflow-x-auto custom-scrollbar">
<div class="flex-none px-4 py-2.5 rounded-full bg-primary text-white text-sm font-semibold border border-primary">
                    Европейская
                </div>
<div class="flex-none px-4 py-2.5 rounded-full bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 text-sm font-semibold border border-slate-200 dark:border-slate-800">
                    Азиатская
                </div>
<div class="flex-none px-4 py-2.5 rounded-full bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 text-sm font-semibold border border-slate-200 dark:border-slate-800">
                    Казахская
                </div>
<div class="flex-none px-4 py-2.5 rounded-full bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 text-sm font-semibold border border-slate-200 dark:border-slate-800">
                    Итальянская
                </div>
<div class="flex-none px-4 py-2.5 rounded-full bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 text-sm font-semibold border border-slate-200 dark:border-slate-800">
                    Фьюжн
                </div>
</div>
</section>
<!-- Section: Вместимость -->
<section class="mt-8 px-4">
<h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-3 px-1">Вместимость</h2>
<div class="grid grid-cols-2 gap-3">
<button class="py-3 px-4 rounded-xl bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-800 text-sm font-semibold active:border-primary active:text-primary transition-all">
                    до 10 чел
                </button>
<button class="py-3 px-4 rounded-xl bg-primary/10 text-primary border border-primary text-sm font-bold">
                    10-30 чел
                </button>
<button class="py-3 px-4 rounded-xl bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-800 text-sm font-semibold active:border-primary active:text-primary transition-all">
                    30-100 чел
                </button>
<button class="py-3 px-4 rounded-xl bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-800 text-sm font-semibold active:border-primary active:text-primary transition-all">
                    100+ чел
                </button>
</div>
</section>
<!-- Section: Удобства -->
<section class="mt-8 px-4 mb-10">
<h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-3 px-1">Удобства</h2>
<div class="bg-white dark:bg-slate-900 rounded-xl overflow-hidden border border-slate-200 dark:border-slate-800">
<label class="flex items-center justify-between p-4 border-b border-slate-100 dark:border-slate-800 last:border-0 active:bg-slate-50 dark:active:bg-slate-800 transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-slate-400">local_parking</span>
<span class="text-base font-medium">Парковка</span>
</div>
<input class="checkbox-custom h-6 w-6 rounded-lg border-slate-300 dark:border-slate-700 text-primary focus:ring-primary focus:ring-offset-0 bg-transparent" type="checkbox"/>
</label>
<label class="flex items-center justify-between p-4 border-b border-slate-100 dark:border-slate-800 last:border-0 active:bg-slate-50 dark:active:bg-slate-800 transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-slate-400">deck</span>
<span class="text-base font-medium">Летняя терраса</span>
</div>
<input class="checkbox-custom h-6 w-6 rounded-lg border-slate-300 dark:border-slate-700 text-primary focus:ring-primary focus:ring-offset-0 bg-transparent" type="checkbox"/>
</label>
<label class="flex items-center justify-between p-4 border-b border-slate-100 dark:border-slate-800 last:border-0 active:bg-slate-50 dark:active:bg-slate-800 transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-slate-400">child_care</span>
<span class="text-base font-medium">Детская зона</span>
</div>
<input class="checkbox-custom h-6 w-6 rounded-lg border-slate-300 dark:border-slate-700 text-primary focus:ring-primary focus:ring-offset-0 bg-transparent" type="checkbox"/>
</label>
</div>
</section>
</main>
<!-- Sticky Bottom Action Bar -->
<footer class="fixed bottom-0 left-0 right-0 p-4 bg-white/90 dark:bg-background-dark/90 backdrop-blur-lg border-t border-slate-200 dark:border-slate-800 pb-8">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-transform active:scale-[0.98]">
            Показать 124 результата
        </button>
</footer>
</body></html>
