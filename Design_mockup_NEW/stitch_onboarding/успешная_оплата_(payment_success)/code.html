<!DOCTYPE html>

<html lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Успешная оплата | Kezdes</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#11d411",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102210",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .ios-shadow {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col font-display">
<!-- Header / Status Bar Space -->
<div class="h-12 w-full"></div>
<!-- Main Content Container -->
<main class="flex-1 flex flex-col items-center px-6 pt-8 pb-12 max-w-md mx-auto w-full">
<!-- Animated-style Success Icon Container -->
<div class="mb-8 flex items-center justify-center">
<div class="relative flex items-center justify-center">
<!-- Outer Ring -->
<div class="absolute w-32 h-32 rounded-full bg-primary/10 animate-pulse"></div>
<!-- Middle Ring -->
<div class="absolute w-24 h-24 rounded-full bg-primary/20"></div>
<!-- Core Icon -->
<div class="relative w-20 h-20 rounded-full bg-primary flex items-center justify-center shadow-lg shadow-primary/30">
<span class="material-symbols-outlined text-white text-5xl font-bold">check</span>
</div>
</div>
</div>
<!-- Success Message -->
<div class="text-center space-y-2 mb-10">
<h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-slate-50">
                Оплата прошла успешно!
            </h1>
<p class="text-slate-500 dark:text-slate-400 text-sm">
                Ваше бронирование подтверждено и оплачено.
            </p>
</div>
<!-- Summary Card -->
<div class="w-full bg-white dark:bg-slate-900/50 rounded-xl p-6 ios-shadow border border-slate-100 dark:border-slate-800 mb-10">
<div class="space-y-4">
<div class="flex flex-col">
<span class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold mb-1">Ресторан</span>
<span class="text-lg font-semibold text-slate-800 dark:text-slate-100">Grand Cru Moscow</span>
</div>
<div class="h-px bg-slate-100 dark:bg-slate-800 w-full"></div>
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col">
<span class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold mb-1">ID Транзакции</span>
<span class="text-sm font-medium text-slate-600 dark:text-slate-300">#KZ-882941</span>
</div>
<div class="flex flex-col text-right">
<span class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold mb-1">Дата</span>
<span class="text-sm font-medium text-slate-600 dark:text-slate-300">24 Окт, 2023</span>
</div>
</div>
<div class="h-px bg-slate-100 dark:bg-slate-800 w-full"></div>
<div class="flex justify-between items-center pt-2">
<span class="text-slate-500 font-medium">Сумма к оплате</span>
<span class="text-2xl font-bold text-primary">15 000 ₽</span>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full space-y-3 mt-auto">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-semibold py-4 rounded-xl transition-all active:scale-[0.98] shadow-lg shadow-primary/20">
                Вернуться к бронированию
            </button>
<button class="w-full bg-transparent border-2 border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 font-semibold py-4 rounded-xl transition-all flex items-center justify-center gap-2 active:scale-[0.98]">
<span class="material-symbols-outlined text-xl">description</span>
                Скачать инвойс
            </button>
</div>
</main>
<!-- Bottom Navigation Bar (Contextual) -->
<nav class="sticky bottom-0 w-full border-t border-slate-100 dark:border-slate-800 bg-white/80 dark:bg-background-dark/80 backdrop-blur-lg px-6 py-3 flex justify-between items-center safe-area-bottom">
<a class="flex flex-col items-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined">home</span>
<span class="text-[10px] font-medium">Главная</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined">calendar_today</span>
<span class="text-[10px] font-medium">Брони</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined">search</span>
<span class="text-[10px] font-medium">Поиск</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined">notifications</span>
<span class="text-[10px] font-medium">Уведомления</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined">person</span>
<span class="text-[10px] font-medium">Профиль</span>
</a>
</nav>
<!-- Background Decorative Elements -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none -z-10 overflow-hidden">
<div class="absolute -top-24 -right-24 w-64 h-64 bg-primary/5 rounded-full blur-3xl"></div>
<div class="absolute top-1/2 -left-24 w-48 h-48 bg-primary/5 rounded-full blur-3xl"></div>
</div>
