<!DOCTYPE html>

<html lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kezdes - Обучающий экран</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 flex justify-center">
<!-- Mobile Screen Wrapper (iOS Style) -->
<div class="relative flex h-screen w-full max-w-[430px] flex-col bg-white dark:bg-background-dark overflow-hidden shadow-2xl">
<!-- Top Navigation -->
<div class="flex items-center justify-end p-6">
<button class="text-slate-500 dark:text-slate-400 text-sm font-medium hover:text-primary transition-colors">
                Пропустить
            </button>
</div>
<!-- Main Content Scroll Area -->
<div class="flex-1 flex flex-col items-center justify-center px-8 text-center">
<!-- 3-Step Graphic Container -->
<div class="w-full mb-12 relative">
<!-- Illustration Background -->
<div class="w-full aspect-square bg-primary/5 dark:bg-primary/10 rounded-full absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 scale-110"></div>
<!-- Flow Graphic -->
<div class="relative flex items-center justify-between w-full max-w-sm mx-auto">
<!-- Step 1 -->
<div class="flex flex-col items-center z-10">
<div class="w-16 h-16 rounded-xl bg-white dark:bg-slate-800 shadow-lg flex items-center justify-center border border-slate-100 dark:border-slate-700">
<span class="material-symbols-outlined text-primary text-3xl">restaurant</span>
</div>
<span class="mt-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Выбор</span>
</div>
<!-- Arrow 1 -->
<div class="flex-1 h-[2px] bg-primary/20 mx-2 -mt-6"></div>
<!-- Step 2 -->
<div class="flex flex-col items-center z-10">
<div class="w-16 h-16 rounded-xl bg-primary shadow-lg shadow-primary/30 flex items-center justify-center">
<span class="material-symbols-outlined text-white text-3xl">event_available</span>
</div>
<span class="mt-3 text-xs font-semibold text-primary uppercase tracking-wider">Бронь</span>
</div>
<!-- Arrow 2 -->
<div class="flex-1 h-[2px] bg-primary/20 mx-2 -mt-6"></div>
<!-- Step 3 -->
<div class="flex flex-col items-center z-10">
<div class="w-16 h-16 rounded-xl bg-white dark:bg-slate-800 shadow-lg flex items-center justify-center border border-slate-100 dark:border-slate-700">
<span class="material-symbols-outlined text-emerald-500 text-3xl">check_circle</span>
</div>
<span class="mt-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Успех</span>
</div>
</div>
</div>
<!-- Text Content -->
<div class="space-y-4">
<h1 class="text-[28px] font-bold leading-tight tracking-tight text-slate-900 dark:text-white">
                    Как организовать событие
                </h1>
<p class="text-base text-slate-500 dark:text-slate-400 leading-relaxed max-w-[300px] mx-auto">
                    Планируйте деловые встречи и бронируйте рестораны в несколько кликов. Мы упростили процесс от выбора места до подтверждения гостями.
                </p>
</div>
</div>
<!-- Bottom Controls -->
<div class="p-8 space-y-8">
<!-- Pagination Dots -->
<div class="flex items-center justify-center gap-2">
<div class="h-1.5 w-6 rounded-full bg-primary"></div>
<div class="h-1.5 w-1.5 rounded-full bg-slate-200 dark:bg-slate-700"></div>
<div class="h-1.5 w-1.5 rounded-full bg-slate-200 dark:bg-slate-700"></div>
</div>
<!-- Action Button -->
<div class="flex flex-col gap-3">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-semibold py-4 rounded-xl transition-all shadow-lg shadow-primary/20 flex items-center justify-center gap-2">
                    Далее
                    <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</div>
<!-- iOS Home Indicator Spacing -->
<div class="h-2"></div>
</div>
<!-- Decorative Background Element -->
<div class="absolute -top-24 -left-24 w-64 h-64 bg-primary/5 rounded-full blur-3xl"></div>
<div class="absolute -bottom-24 -right-24 w-64 h-64 bg-primary/10 rounded-full blur-3xl"></div>
</div>
</body></html>
